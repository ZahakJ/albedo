# Builds the project site (landing page, manual, and the app under /app/ with
# its AI models) and publishes it to GitHub Pages.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python tools for half-precision models
        run: pip install onnx numpy

      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ hashFiles('src/engine/models.js') }}

      - name: Build the app with its models
        run: |
          npm ci
          npm run setup-models
          npm run test:unit
          npm run build

      - name: Install mdBook
        run: |
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar xz -C /usr/local/bin mdbook
          mdbook --version

      - name: Build the site
        run: sh docs/build-site.sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
